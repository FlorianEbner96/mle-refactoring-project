[project]
name = "mle-refactoring-project"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "skops>=0.14.0",
]

[dependency-groups]
api = [
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]

[tool.uv]
required-version = ">=0.13.5"
# Locally install dev tools and the API dependencies; Docker will install only `api`.
default-groups = ["dev", "api"]
# Apply certificate fixes without adding unused runtime packages.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
